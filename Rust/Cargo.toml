[package]
name = "pic2webp"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif", "tga", "ico"] }
webp = "0.3"
zip = "2"
sevenz-rust = "0.6"
walkdir = "2"
tempfile = "3"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
